<!DOCTYPE html>
<!--
  FeedVision — Operatör Ekranı (15-09-2026 eklendi, G grubu; 15-09-2026
  genişletildi — Fatih'in "kullanım kolaylığı" revizyonu)

  Sıralama (yukarıdan aşağı, Fatih'in kararı): 1) ana ekrana dönüş,
  2) port/bağlantı, 3) konsol, 3.5) Besleme Başlat (mm/s,mm,mm/s²,RPM —
  23-09-2026 eklendi, aşağıya bkz.), 4) step motor kontrolleri (ham/µs-adım,
  ileri seviye), 5) büyük DURDUR + küçük Alarm Sustur, 6) DC motor
  kontrolleri (ham/duty%, ileri seviye), 7) encoder + sıfırlama, 8) kameralar.
  ROI/kalibrasyon, Kontrol Kriterleri tanımlama, ham sistem logları, Hareket
  Analizi, sıcaklık/CPU/RAM grafikleri, Hareket Parametreleri (D_drive vb.)
  — hâlâ Admin-only.

  Not (bilinen sınırlama): Encoder mm dönüşümü için teker çapı (Admin'de
  girilir) tarayıcının localStorage'ında tutuluyor — aynı cihaz/tarayıcıda
  açılmazsa 40mm varsayılanına düşer (bkz. admin.html'deki aynı not). Bu,
  aşağıdaki Besleme Başlat panelinin kullandığı D_drive_mm/D_wheel_dc_mm/
  D_rod_mm/RPM_MAX_NOLOAD'dan (server-side, Admin'de düzenlenir) AYRI —
  ikisi farklı amaçlara hizmet ediyor (biri sadece görsel grafik, diğeri
  gerçek komut hesaplaması).

  Besleme Başlat (23-09-2026 eklendi, GÖREV 1+2+3): operatör artık ham
  delay/steps/duty% GÖRMEDEN, mm/s + mm + mm/s² + RPM girip TEK butonla
  step+DC'yi senkron başlatabiliyor (bkz. POST /motor/feed-start, backend
  motion_calc.py'de dönüşüm yapıyor; step bitince DC otomatik duruyor).
  Aşağıdaki ham Step/DC panelleri KALDIRILMADI (ileri seviye/hata ayıklama
  için) — bu yeni panel onların YANINA eklendi, yerine geçmedi.

  6 motorlu sistem (21-10-2026): Besleme Başlat artık NEMA23 (her zaman) +
  isteğe bağlı Yardımcı çift / Rotasyon çifti / DC; her motorun KENDİ hız kutusu
  var, kısa yol düğmeleri sadece kutucukları işaretler. Panelin HTML'i ve mantığı
  shared.js'te (Operatör + Admin ortak); bağımsız Yardımcı çift / Rotasyon çifti
  panelleri ve Besleme panelindeki hareket durum lambası da orada.
-->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FeedVision — Operatör</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; color: #eee;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 14px; display: flex; flex-direction: column; gap: 16px;
    }
    .panel { background: #1a1a1a; border-radius: 12px; padding: 16px; }
    .panel h2 { margin: 0 0 10px; font-size: 16px; color: #ccc; }

    #back-btn {
      align-self: flex-start; padding: 8px 16px; font-size: 14px; border-radius: 8px;
      border: none; background: #333; color: #eee; cursor: pointer;
    }

    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .status-dot.connected { background: #2ecc71; }
    .status-dot.disconnected { background: #c0392b; }

    #rule-alarm-banner {
      display: none; background: #a33; color: #fff; padding: 14px; border-radius: 8px;
      font-weight: bold; font-size: 17px; text-align: center;
    }

    .row-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .row-group label { font-size: 13px; color: #aaa; }
    .row-group input, .row-group select {
      padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #444;
      background: #111; color: #eee; width: 90px;
    }
    .row-group input:disabled { opacity: .4; cursor: not-allowed; }
    button {
      padding: 10px 16px; font-size: 14px; border-radius: 8px; border: none;
      background: #333; color: #eee; cursor: pointer;
    }
    button:active { background: #444; }
    button:disabled { background: #292929; color: #666; cursor: not-allowed; }

    #console { background: #0c0c0c; border-radius: 8px; padding: 10px; height: 160px;
      overflow-y: auto; font-family: "SF Mono", Menlo, monospace; font-size: 12px; }
    #console .line { padding: 2px 0; border-bottom: 1px solid #1f1f1f; }
    #console .time { color: #666; }
    #console .button-name { color: #6cf; }
    #console .error { color: #f66; }
    #console .result { color: #9d9; }

    .running-warning { display: none; color: #fb4; font-size: 13px; margin-top: 6px; }
    .running-warning.show { display: block; }

    #stop-row { display: flex; align-items: center; gap: 14px; }
    #stop-btn {
      flex: 1; padding: 30px 0; font-size: 30px; font-weight: 800; letter-spacing: .05em;
      background: #c0392b; color: #fff; border: none; border-radius: 14px; cursor: pointer;
    }
    #stop-btn:active { background: #922b21; }
    #mute-btn { padding: 12px 18px; font-size: 13px; }
    #mute-btn.active { background: #654; color: #fd8; }
    #stop-status { text-align: center; color: #999; font-size: 13px; min-height: 16px; margin-top: 6px; }

    .encoders { display: flex; gap: 14px; margin-bottom: 10px; }
    .encoder-box { flex: 1; background: #111; border-radius: 10px; padding: 16px; text-align: center; }
    .encoder-box .label { font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: .05em; }
    .encoder-box .value { font-family: "SF Mono", Menlo, monospace; font-size: 46px; font-weight: 800; color: #eee; }

    .cameras { display: flex; gap: 14px; flex-wrap: wrap; }
    .camera-block { flex: 1; min-width: 280px; background: #111; border-radius: 10px; padding: 12px; }
    .camera-block h3 { margin: 0 0 8px; font-size: 15px; color: #ccc; }
    .camera-block img { width: 100%; border-radius: 8px; background: #000; display: none; }
    .camera-block img.open { display: block; }
    .camera-block .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    #scan-save-status { color: #888; font-size: 12.5px; }

    /* Besleme Başlat (23-09-2026) — diğer panellerden görsel olarak biraz
       ayrışsın diye ince bir vurgu çerçevesi (birincil kontrol olduğu için). */
    #feed-start-panel { border: 1px solid #2a5; }
    #feed-start-panel h2 { color: #6c6; }
    #feed-start-btn { background: #2a5; color: #fff; font-weight: 700; }
    #feed-start-btn:active { background: #1e4; }
    #feed-start-btn:disabled { background: #292929; color: #666; }
    #feed-start-result { font-size: 13px; color: #aaa; margin-top: 8px; white-space: pre-wrap; }
    #feed-start-result.error { color: #f66; }
    #feed-start-result.success { color: #9d9; }
    /* 29-09-2026 (Madde 6): acil-durdurma hissi — daha büyük/kırmızı, mantığı DEĞİŞMEDİ. */
    #feed-start-stop-btn {
      padding: 16px 26px; font-size: 18px; font-weight: 800;
      background: #c0392b; color: #fff;
    }
    #feed-start-stop-btn:active { background: #922b21; }
    /* Dokunmatik ekranda kaydırma metin seçmesin (parmak = sürüklenen fare gibi
       geliyordu). Kopyalanması mantıklı çıktı alanları aşağıda hariç tutulur.
       Canvas'ın kendi touch-action:none kuralı korunur (ROI çizimi). */
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    input, textarea, select, pre, code, [contenteditable], .selectable, #console, #feed-start-result, #stop-status, #motion-lamp-diag { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>

  <!-- 1) Ana ekrana dönüş -->
  <button id="back-btn" onclick="location.href='/'">← Ana Ekran</button>

  <div id="rule-alarm-banner"></div>

  <!-- 2) Port seçimi + STM32 bağlantısı -->
  <div class="panel">
    <h2>Kontrol Kartı Bağlantısı</h2>
    <div class="row-group">
      <label>Seri port:</label>
      <select id="port-select"></select>
      <button onclick="refreshPorts()">Yenile</button>
      <button onclick="connectSerial()">Bağlan</button>
      <button onclick="disconnectSerial()">Bağlantıyı Kes</button>
      <span id="status-dot" class="status-dot disconnected"></span>
      <span id="connection-text">Bağlı değil</span>
    </div>
  </div>

  <!-- 3) Konsol -->
  <div class="panel">
    <h2>Konsol</h2>
    <div class="row-group" style="margin-bottom:6px;">
      <button onclick="clearConsole()">Konsolu Temizle</button>
    </div>
    <div id="console"></div>
  </div>

  <!-- 3.5) Besleme Başlat (23-09-2026 eklendi) — fiziksel birimlerle (mm/s,
       mm, mm/s², RPM) TEK butonla step+DC senkron başlatma. Aşağıdaki ham
       Step Motor/DC Motor panelleri (ileri seviye/hata ayıklama) YERİNE
       değil, YANINA eklendi. -->
  <!-- İçerik shared.js initControlPanels() ile doldurulur (Operatör + Admin ortak HTML):
       NEMA23 her zaman çalışır; Yardımcı çift / Rotasyon çifti / DC kutucukla seçilir,
       her birinin kendi hız kutusu var; kısa yol düğmeleri sadece kutucukları işaretler;
       hareket durum lambası + yardımcı motor etiketleri panelin altında. -->
  <div class="panel" id="feed-start-panel"></div>

  <!-- 4) Step motor kontrolü (ham/µs-adım, ileri seviye) -->
  <div class="panel">
    <h2>NEMA23 (Step Motor) — ham kontrol</h2>
    <div class="row-group">
      <label>Yön:</label>
      <select id="step-dir"><option value="1">Geri</option><option value="0">İleri</option></select>
      <label>Gecikme (µs):</label>
      <input id="step-delay" type="number" value="500" min="1">
      <label>Adım:</label>
      <input id="step-count" type="number" value="2000" min="1">
      <label>İvme (adım):</label>
      <input id="step-accel" type="number" value="0" min="0">
      <button id="step-at-btn" onclick="sendStep()">Step At</button>
      <button data-no-drag-scroll onclick="stopStep()">Durdur</button>
    </div>
    <!-- 15-09-2026: "yeni komut önceki hareketin üzerine yazacak" gibi bir
         kuyruğa alma mekanizması YOK — sadece durum bilgisi, buton zaten
         hareket halindeyken devre dışı (bkz. renderStatus). -->
    <div id="running-warning" class="running-warning">⚠ Step motor şu an hareket halinde — yeni komut gönderilemez, bitmesini bekleyin ya da Durdur'a basın.</div>
  </div>

  <!-- 5) Büyük DURDUR + küçük Alarm Sustur -->
  <div class="panel">
    <div id="stop-row">
      <button data-no-drag-scroll id="stop-btn" onclick="emergencyStop()">DURDUR</button>
      <button id="mute-btn" onclick="toggleAlarmMute()">🔇 Alarm Sustur</button>
    </div>
    <div id="stop-status"></div>
  </div>

  <!-- 6) DC motor kontrolü -->
  <div class="panel">
    <h2>DC Motor</h2>
    <div class="row-group">
      <label for="dc-speed">Hız: <span id="dc-speed-val">100</span>%</label>
      <input type="range" id="dc-speed" min="0" max="100" step="1" value="100"
        oninput="document.getElementById('dc-speed-val').textContent = this.value">
    </div>
    <div class="row-group">
      <button onclick="sendDc('forward', 'Saat Yönü')">Saat Yönü</button>
      <button onclick="sendDc('backward', 'Saat Yönünün Tersi')">Saat Yönünün Tersi</button>
      <button data-no-drag-scroll onclick="sendDc('stop', 'Dur')">Dur</button>
    </div>
  </div>

  <!-- Yardımcı çift ve Rotasyon çifti bağımsız kontrolü (21-10-2026) — Besleme Başlat'a
       girmeden tek başına başlat/durdur; içerik shared.js'ten (iki panel aynı yapıda). -->
  <div class="panel" id="assist-panel"></div>
  <div class="panel" id="rot-panel"></div>

  <!-- 7) Encoder bilgileri + sıfırlama -->
  <div class="panel">
    <h2>Encoder</h2>
    <div class="encoders">
      <div class="encoder-box">
        <div class="label">Encoder 1</div>
        <div class="value" id="er-e1-mm">— mm</div>
      </div>
      <div class="encoder-box">
        <div class="label">Encoder 2</div>
        <div class="value" id="er-e2-mm">— mm</div>
      </div>
    </div>
    <div class="row-group">
      <button onclick="resetEncoders()">Encoder'ları Sıfırla</button>
    </div>
    <!-- 29-09-2026 eklendi: sadece en son başarılı Besleme Başlat çağrısından
         sonra dolar (bkz. sendFeedStart -> renderFeedSpeedInfo, shared.js). -->
    <div id="feed-speed-info" style="font-size:12.5px;color:#888;margin-top:6px"></div>
  </div>

  <!-- 8) Kameralar -->
  <div class="panel">
    <h2>Kameralar</h2>
    <div class="cameras">
      <div class="camera-block">
        <h3>Chamber Camera</h3>
        <div class="row">
          <button onclick="toggleCamera('chamber')">Aç/Kapat</button>
        </div>
        <img id="camera-chamber">
      </div>
      <div class="camera-block">
        <h3>UI Screen Camera</h3>
        <div class="row">
          <button onclick="toggleCamera('ui_screen')">Aç/Kapat</button>
          <button onclick="scanSave()">Scan Save</button>
          <span id="scan-save-status"></span>
        </div>
        <img id="camera-ui_screen">
      </div>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script>
    let mm1PerCount = 0;
    let mm2PerCount = 0;
    let lastStatus = {};

    function loadWheelDiameters() {
      const d1 = parseFloat(localStorage.getItem("feedvision_wheel-enc1")) || 40;
      const d2 = parseFloat(localStorage.getItem("feedvision_wheel-enc2")) || 40;
      // 600 PPR encoder x4 quadrature kenar çarpanı = 2400 sayım/tur — admin.html
      // ile BİREBİR AYNI sabit olmalı, yoksa iki ekran farklı mm gösterir.
      const ENC_COUNTS_PER_REV = 600 * 4;
      mm1PerCount = (Math.PI * d1) / ENC_COUNTS_PER_REV;
      mm2PerCount = (Math.PI * d2) / ENC_COUNTS_PER_REV;
    }

    function renderStatus(status) {
      if (!status || !Object.keys(status).length) return;
      lastStatus = status;
      document.getElementById("er-e1-mm").textContent = `${(status.e1 * mm1PerCount).toFixed(1)} mm`;
      document.getElementById("er-e2-mm").textContent = `${(status.e2 * mm2PerCount).toFixed(1)} mm`;
      document.getElementById("running-warning").classList.toggle("show", !!status.running);
      const stepBtn = document.getElementById("step-at-btn");
      if (stepBtn) stepBtn.disabled = !!status.running;
      const feedBtn = document.getElementById("feed-start-btn");
      if (feedBtn) feedBtn.disabled = !!status.running;
    }

    let previousConnectionState = null;

    function onStatusMessage(data) {
      const dot = document.getElementById("status-dot");
      const text = document.getElementById("connection-text");
      dot.className = "status-dot " + (data.is_connected ? "connected" : "disconnected");
      text.textContent = data.is_connected ? "Bağlı" : "Bağlı değil";
      if (previousConnectionState !== data.is_connected) {
        previousConnectionState = data.is_connected;
        logToConsole("Canlı Durum", "Kontrol kartı bağlantısını izle",
          data.is_connected ? "Bağlantı kuruldu." : "Bağlantı yok/koptu.", !data.is_connected);
      }
      renderStatus(data.status);
    }

    function toggleAlarmMute() {
      alarmMuted = !alarmMuted;
      const btn = document.getElementById("mute-btn");
      btn.classList.toggle("active", alarmMuted);
      btn.textContent = alarmMuted ? "🔇 Alarm Susturuldu" : "🔇 Alarm Sustur";
      logToConsole("Alarm Sustur", "Sesli alarmı aç/kapat", alarmMuted ? "Susturuldu." : "Tekrar açıldı.", false);
    }

    async function emergencyStop() {
      // NEMA23 + Yardımcı çift + Rotasyon çifti + DC BİRLİKTE, anında durdurur
      // (tek istek /motor/stop-all; sunucu dört kanalı bağımsız durdurur, bkz.
      // shared.js stopAllMotors). Kontrol Kriterleri/Step At değişikliklerinden BAĞIMSIZ.
      await stopAllMotors();
    }

    // --- Seri port ---
    async function refreshPorts() {
      const task = "Bilgisayara takılı seri portları listele";
      try {
        const r = await fetch("/serial/ports");
        const data = await r.json();
        const select = document.getElementById("port-select");
        select.innerHTML = "";
        data.ports.forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p; opt.textContent = p;
          select.appendChild(opt);
        });
        logToConsole("Yenile", task, `${data.ports.length} port bulundu.`, false);
      } catch (e) {
        logToConsole("Yenile", task, `İstek başarısız: ${e}`, true);
      }
    }

    async function connectSerial() {
      const port = document.getElementById("port-select").value;
      const task = `Kontrol kartına ${port} portundan bağlan`;
      if (!port) {
        logToConsole("Bağlan", task, "Önce bir port seçmelisin (Yenile'ye bas).", true);
        return;
      }
      try {
        const r = await fetch(`/serial/connect?port=${encodeURIComponent(port)}`, { method: "POST" });
        const data = await r.json();
        logToConsole("Bağlan", task, data.success ? "Bağlantı kuruldu." : `Bağlanamadı: ${data.error}`, !data.success);
      } catch (e) {
        logToConsole("Bağlan", task, `İstek başarısız: ${e}`, true);
      }
    }

    async function disconnectSerial() {
      const task = "Kontrol kartı bağlantısını kapat";
      await fetch("/serial/disconnect", { method: "POST" });
      logToConsole("Bağlantıyı Kes", task, "Bağlantı kapatıldı.", false);
    }

    // --- Motor komutları — admin.html'deki ham "Giden Komut/Yanıt" kutuları
    // burada YOK (kasıtlı, sade arayüz), sonuç sadece Konsol'a yazılıyor. ---
    function logCmdResult(buttonName, data) {
      const resultText = !data.sent ? "Gönderilemedi (bağlı değil)."
        : data.timed_out ? "Gönderildi, yanıt gelmedi (timeout)."
        : `Gönderildi → Kontrol kartı: ${data.raw_reply}`;
      const isError = !data.sent || data.timed_out || (data.reply && data.reply.err);
      logToConsole(buttonName, buttonName, resultText, !!isError);
    }

    // Besleme Başlat gönderimi ve doğrulaması artık shared.js'te (sendFeedStart) —
    // Operatör ve Admin aynı kodu kullanıyor.

    async function sendStep() {
      // Buton zaten hareket halindeyken disabled oluyor (renderStatus), ama
      // yarış durumu/hızlı çift tık ihtimaline karşı burada da GERÇEK bir
      // koruma var — olmayan bir "kuyruğa alma" davranışı varmış gibi
      // göstermek yerine açıkça reddediyoruz (15-09-2026 düzeltmesi).
      if (lastStatus && lastStatus.running) {
        logToConsole("Step At", "Step komutu hazırla",
          "Hareket bitmeden yeni komut verilemez. Hareketi durdurun veya bitmesini bekleyin.", true);
        return;
      }
      const dir = parseInt(document.getElementById("step-dir").value);
      const delay = parseInt(document.getElementById("step-delay").value);
      const steps = parseInt(document.getElementById("step-count").value);
      const accel = parseInt(document.getElementById("step-accel").value) || 0;
      if (!(delay > 0) || !(steps > 0)) {
        logToConsole("Step At", "Step komutu hazırla", "Geçersiz değer — gecikme ve adım 0'dan büyük olmalı, gönderilmedi.", true);
        return;
      }
      if (accel < 0) {
        logToConsole("Step At", "Step komutu hazırla", "İvme negatif olamaz, gönderilmedi.", true);
        return;
      }
      const r = await fetch("/motor/step", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dir, delay, steps, accel }),
      });
      logCmdResult("Step At", await r.json());
    }

    async function stopStep() {
      const r = await fetch("/motor/stop", { method: "POST" });
      logCmdResult("Durdur", await r.json());
    }

    async function sendDc(dir, label) {
      const speed = Number(document.getElementById("dc-speed").value);
      const r = await fetch("/motor/dc", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dir, speed }),
      });
      logCmdResult(label, await r.json());
    }

    async function resetEncoders() {
      const r = await fetch("/motor/reset", { method: "POST" });
      logCmdResult("Encoder'ları Sıfırla", await r.json());
    }

    // --- Kameralar ---
    async function toggleCamera(camId) {
      const img = document.getElementById("camera-" + camId);
      const isOpen = img.classList.contains("open");
      if (isOpen) {
        img.classList.remove("open");
        img.removeAttribute("src");
        return;
      }
      try {
        const check = await fetch(`/vision/${camId}/snapshot`);
        if (!check.ok) {
          logToConsole("Kamera Aç/Kapat", `${camId} görüntüsünü göster`, `Sunucu ${check.status}`, true);
          return;
        }
      } catch (e) {
        logToConsole("Kamera Aç/Kapat", `${camId} görüntüsünü göster`, `Ağ hatası: ${e.message}`, true);
        return;
      }
      img.src = `/vision/${camId}/stream?t=${Date.now()}`;
      img.classList.add("open");
    }

    async function scanSave() {
      // Sadece UI Screen Camera icin gecerli (Chamber Camera'da bu buton hic yok).
      const statusEl = document.getElementById("scan-save-status");
      statusEl.textContent = "Kaydediliyor…";
      let response;
      try {
        response = await fetch("/vision/ui_screen/scan-save", { method: "POST" });
      } catch (e) {
        statusEl.textContent = "Kaydedilemedi (ağ hatası).";
        logToConsole("Scan Save", "POST /vision/ui_screen/scan-save", `Ağ hatası: ${e.message}`, true);
        return;
      }
      let data;
      try {
        data = await response.json();
      } catch {
        data = null;
      }
      if (!response.ok) {
        const detail = data?.detail ?? "bilinmeyen hata";
        statusEl.textContent = `Kaydedilemedi: ${detail}`;
        logToConsole("Scan Save", "POST /vision/ui_screen/scan-save", `Sunucu ${response.status}: ${detail}`, true);
        return;
      }
      const path = `scans/${data.filename}`;
      statusEl.textContent = `Kaydedildi: ${path}`;
      logToConsole(
        "Scan Save",
        "POST /vision/ui_screen/scan-save",
        `Scan Save tuşuna basıldı. UI Screen kamerasının görüntüsü ${path} konumuna kaydedildi.`,
        false,
      );
    }

    loadWheelDiameters();
    initControlPanels();  // shared.js: Besleme Başlat + Rotasyon/Yardımcı çift panelleri, izinli hız aralıkları
    refreshPorts();
    startStatusWebSocket(onStatusMessage);
  </script>
  <script src="/touch_scroll.js"></script>
</body>
</html>
